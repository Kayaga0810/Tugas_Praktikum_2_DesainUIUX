<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan Pizza</title>
</head>
<body>
    
    <h1>PIZZA DELIVERY FASTER</h1>
    <p>
        Silakan isi form pemesanan ini dengan lengkap dan benar.
    </p>
    <form action="hasil.html" method="get">
        <fieldset>
            <legend>Informasi Pemesan</legend>
            <p>
                <label for="costomername">Nama Lengkap:</label>
                <input type="text" id="costomername" name="costomername" required>
            </p>

            <p>
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </p>

            <p>
                <label for="telephone">Telephone:</label>
                <input type="text" id="telephone" name="telephone" required>
            </p>

            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="intructions">Delivery instructions:</label><br>
                <textarea
                    id="intruction"
                    name="intruction"
                    rows="4"
                    cols="50"
                    maxlength="400"
                    placeholder="no more than 400 characther"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Design Your Dream Pizza</legend>
            <p><strong>Pizza Specs</strong></p>
            <p>Pilihan salah satu</p>
            
            <p>
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">Classic White</label><br>
 
                <input type="radio" id="pepperoni" name="crust" value="pepperoni" required>
                <label for="pepperoni">Pepperoni</label><br>
 
                <input type="radio" id="mozzarella" name="crust" value="mozzarella" required>
                <label for="mozzarella">Mozzarella</label><br>
 
                <input type="radio" id="margherita" name="crust" value="margherita" required>
                <label for="margherita">Margherita</label><br>
            </p>

            <p><strong>Topping</strong></p>

            <p>
               <input type="checkbox" id="Ayam" name="topping" value="classic white" >
                <label for="Ayam">Ayam</label><br>
 
                <input type="checkbox" id="Keju" name="topping" value="pepperoni" >
                <label for="Keju">Keju</label><br>
 
                <input type="checkbox" id="Red Sauce" name="topping" value="mozzarella" >
                <label for="Red Sauce">Red Sauce</label><br>
 
                <input type="checkbox" id="Buldogh" name="topping" value="sosis" >
                <label for="Buldogh">Buldogh</label><br>
            </p>

            <p>
                <label for="quantity">Quantity:</label>
                <select id="quantity" name="quantity" required>
                    <option value="">Pilih jumlah</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </p>
    </form>
</body>
</html>
