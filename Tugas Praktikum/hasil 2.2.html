<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Hasil Pemesanan</title>
</head>
<body>

    <div  style="text-align: center;">
        <p>A Web Page</p>
        <nav>
            <a href="#">Home</a> | 
            <a href="#">Register</a> |  
            <a href="#">Policy</a> | 
            <a href="#">About</a>
        </nav>
    </div><hr>

    <form>
        <table width="100%">
            <tr>
                <td width="20%" style="vertical-align: top; text-align: center;">
                    <div style="border: 1px solid black; height: 150px; display: flex; align-items: center; justify-content: center;">
                        [ X ]
                    </div>
                </td>
                <td width="80%" style="vertical-align: top;">
                    <p>
                        <label>Title Here:</label><br>
                        <input type="text" value=" Asus Gaming v16 (V3607) " style="width: 100%;">
                    </p>
                    <p>
                        <label for="intructions">Description:</label><br>
                    <textarea rows="4" style="width: 100%;">
Processor : Intel Core 5 210H (8 cores, 12 threads, hingga 4.8 GHz) atau Intel Core 7 240H (10 cores, 16 threads, hingga 5.2 GHz).
RAM : 8GB DDR5-5600 SO-DIMM
Grafis (GPU): NVIDIA GeForce RTX 4050
Layar: 16,0 inci WUXGA (1920 x 1200), rasio 16:10, 144Hz, kecerahan 300 nits, anti-glare, rasio layar ke bodi 89%.
Storage : 512GB M.2 NVMe PCIe 4.0 SSD </textarea>
                    </p>
                    <p>
                        <label>Total Mount</label>
                        <input type="text" value="Rp 16,999,000,00" style="width: 100%;">
                    </p>
                    <p>
                        <label>Payment to:</label><br>
                        <input type="text" value="123-456-789-0" style="width: 100%;">
                    </p>
                    <p>
                        <label>Payment type:</label><br>
                        <select style="width: 100%;">
                            <option>BRI</option>
                            <option>BCA</option>
                            <option>MANDIRI</option>
                            <option>BNI</option>
                            <option>BTN</option>
                            <option>PERMATA</option>
                        </select>
                    </p>
                    <p>
                        <label>Account Holder:</label><br>
                        <input type="text" value="Name Here" style="width: 100%;">
                    </p>
                    <p>
                        <label>Account No:</label>
                        <input type="text" value="123-456-789-0" style="width: 100%;">
                    </p>
                    <p>
                        <input type="checkbox" checked> Send to Mobile Phone<br>
                        <input type="checkbox" checked> Send to Email
                    </p>
                                       <p>
                        <label>Send to Mobile Phone:</label><br>
                        <input type="text" value="08123456789" style="width: 100%;">
                    </p>
                    <p>
                        <label>Send to Email:</label><br>
                        <input type="text" value="rama@example.com" style="width: 100%;">
                    </p>
                                        <p style="text-align: center;">
                        <button type="submit" style="background-color: lightgreen; padding: 5px 15px;">Paying Using Quidlink</button>
                    </p>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
